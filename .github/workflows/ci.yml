name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:15-3.5
        env:
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: air_polution
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      AIR_DB_HOST: localhost
      AIR_DB_PORT: "5432"
      AIR_DB_NAME: air_polution
      AIR_DB_USER: postgres
      AIR_DB_PASSWORD: ci-password
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      - name: Bootstrap an empty warehouse
        run: python -m gaia_pipeline init-db

      - name: dbt build on the empty warehouse (compiles and runs every model and test)
        run: python -m gaia_pipeline dbt build
