[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gaia-pipeline"
version = "1.0.0"
description = "Automated CAMS air-quality pipeline and dbt models for the Gaia PostGIS warehouse"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
gaia = "gaia_pipeline.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
